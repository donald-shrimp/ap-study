ープ端の繰返し指定は，</text><text x="375" y="222" text-anchor="middle" font-size="16">変数名：初期値，増分，終値</text><text x="375" y="245" text-anchor="middle" font-size="16">を示す。</text><rect x="590" y="166" width="180" height="42" fill="white" stroke="black" stroke-width="2"/><text x="680.0" y="194.0" text-anchor="middle" font-size="19">n ← 2</text><path d="M680,208 L680,248" fill="none" stroke="black" stroke-width="2"/><rect x="590" y="248" width="180" height="42" fill="white" stroke="black" stroke-width="2"/><text x="680.0" y="276.0" text-anchor="middle" font-size="19">x ← (x × n)</text><path d="M680,290 L680,324" fill="none" stroke="black" stroke-width="2"/><rect x="590" y="324" width="180" height="42" fill="white" stroke="black" stroke-width="2"/><text x="680.0" y="352.0" text-anchor="middle" font-size="19">n ← (n ＋ 1)</text><path d="M680,366 L680,395" fill="none" stroke="black" stroke-width="2"/><path d="M680,395 L770,433 L680,471 L590,433 Z" fill="white" stroke="black" stroke-width="2"/><rect x="636" y="417" width="88" height="30" fill="white" stroke="black" stroke-width="2"/><text x="680.0" y="439.0" text-anchor="middle" font-size="19">a</text><path d="M590,433 H535 V232 H680" fill="none" stroke="black" stroke-width="2"/><text x="557" y="420" text-anchor="middle" font-size="16">No</text><path d="M680,471 L680,504" fill="none" stroke="black" stroke-width="2"/><text x="706" y="491" text-anchor="middle" font-size="16">Yes</text><rect x="70" y="466" width="180" height="42" rx="22" fill="white" stroke="black" stroke-width="2"/><text x="160" y="494" text-anchor="middle" font-size="19">終了</text><rect x="590" y="504" width="180" height="42" rx="22" fill="white" stroke="black" stroke-width="2"/><text x="680" y="532" text-anchor="middle" font-size="19">終了</text></g></svg>