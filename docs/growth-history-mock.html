<style>

*{box-sizing:border-box}body{margin:0}button,select{font:inherit;color:inherit}button,summary{cursor:pointer;touch-action:manipulation}button:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #b46a10;outline-offset:3px}h1,h2,h3,p{margin:0}h1{font-size:1.25rem}h2{font-size:1.05rem}h3{font-size:.95rem}a{color:var(--accent)}[hidden]{display:none!important}.banner{text-align:center;padding:5px 12px;background:#edf2fa;color:var(--muted);font-size:.75rem}.header{background:#fff;border-bottom:1px solid var(--line)}.header-inner{max-width:720px;margin:auto;min-height:60px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:9px;font-size:1.25rem;font-weight:750}.brand-mark{display:grid;place-items:center;width:34px;height:34px;background:var(--navy);color:#fff;border-radius:10px;font-size:1.5rem}.button{min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:650;line-height:1.5}.quiet{color:var(--muted);font-size:.85rem}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.nav{max-width:720px;margin:auto;padding:8px 16px;display:flex;gap:8px}.nav button{flex:1;color:var(--muted)}.nav [aria-current]{background:#e5edf8;border-color:#9db3cf;color:var(--navy)}main{max-width:720px;margin:auto;padding:20px 16px 28px}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.heading h2{margin:0}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1;min-width:0;font-size:.83rem;padding:9px 5px}.tabs [aria-pressed=true]{background:var(--pale);border-color:var(--accent);color:#14605b}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}.muted{color:var(--muted);font-size:.8rem}.overall{background:var(--navy);color:#fff;padding:20px}.overall h2{font-size:.9rem}.overall h2 span{font-size:.75rem;font-weight:400}.overall-rate{font-size:2.7rem;font-weight:750;line-height:1.2;margin:9px 0}.overall-rate small{font-size:1.2rem}.overall-count{font-size:.95rem}.trend-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.trend-heading select{max-width:100%;min-height:44px;padding:8px 28px 8px 10px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:.85rem}.trend-period{margin-top:5px}.chart{position:relative;margin-top:18px;padding-left:36px}.y-labels{position:absolute;left:0;top:0;bottom:32px;display:flex;flex-direction:column;justify-content:space-between;color:var(--muted);font-size:.7rem}.plot{position:relative;height:176px;margin:0 22px}.plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.chart-grid{stroke:#e0e7ee;stroke-width:1;vector-effect:non-scaling-stroke}.chart-line{stroke:var(--accent);stroke-width:2.5;fill:none;vector-effect:non-scaling-stroke}.point{position:absolute;width:44px;height:44px;transform:translate(-50%,-50%);padding:0;border:0;background:transparent;border-radius:50%;display:grid;place-items:center}.point::after{content:'';width:10px;height:10px;border:2px solid var(--accent);border-radius:50%;background:#fff}.point[aria-pressed=true]::after{width:14px;height:14px;background:var(--accent);border-color:#fff;box-shadow:0 0 0 2px var(--accent)}.point.small-sample::after{border-style:dashed}.x-labels{display:flex;justify-content:space-between;margin:12px 0 0;color:var(--muted);font-size:.7rem}.point-detail{margin-top:16px;padding:10px 12px;background:#f0f7f6;border-radius:10px;min-height:76px}.point-detail .detail-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.point-detail strong{font-size:1.05rem}.point-detail p{font-size:.85rem;margin-top:3px}.trend-help{margin-top:12px}.trend-help summary{color:var(--muted);font-size:.8rem;min-height:44px;padding:10px 0}.trend-help p{font-size:.8rem;color:var(--muted);margin:0 0 8px}.section-heading{margin:20px 0 8px;font-size:1rem}.legend{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:.72rem;color:var(--muted);margin-bottom:10px}.legend span{display:flex;align-items:center;gap:5px}.legend i{width:9px;height:9px;border-radius:2px}.self{background:var(--accent)}.assisted{background:#477db9}.incorrect{background:#b97227}.revealed{background:#7b8792}.field{padding:14px 0;border-bottom:1px solid var(--line)}.field:first-child{padding-top:0}.field:last-child{padding-bottom:0;border:0}.field-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.field-head button{background:transparent;border:0;min-height:44px;padding:6px 0;font-size:.8rem;color:var(--accent);white-space:nowrap}.bar{height:10px;display:flex;border-radius:5px;overflow:hidden;background:#e5eaf0;margin:8px 0}.bar span{height:100%}.field-counts{font-size:.75rem;color:var(--muted)}.link-row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.link-row button{flex:1}.plan-date{color:var(--muted);font-size:.85rem;margin-top:5px}.phase-name{font-size:1.15rem;margin-top:8px}.plan-count{font-size:1.3rem;margin:10px 0 6px;font-weight:750}.plan-count small{font-size:.85rem;color:var(--muted);font-weight:400}.plan-bar{height:8px;background:#e2eaf0;border-radius:4px;overflow:hidden;margin-bottom:10px}.plan-bar span{display:block;height:100%;background:var(--accent)}.focus-label{display:inline-block;background:var(--pale);color:#14605b;padding:3px 9px;border-radius:6px;font-size:.8rem}.timeline{padding:0 16px}.history-period{border-bottom:1px solid var(--line);padding:16px 0}.history-period:last-child{border:0}.history-count{font-size:1.05rem;font-weight:750;margin:8px 0}.history-count small{color:var(--muted);font-weight:400;font-size:.8rem}.history-period .plan-bar{height:6px;margin-bottom:0}.history-period summary,.change summary{display:flex;align-items:center;justify-content:space-between;gap:10px;list-style:none;min-height:44px;font-size:.8rem;color:var(--muted)}summary::-webkit-details-marker{display:none}.history-period summary span:last-child,.change summary span:last-child{font-size:1.1rem}.history-period details[open] summary span:last-child,.change[open] summary span:last-child{transform:rotate(90deg)}.history-period details p{font-size:.8rem;margin:5px 0;color:var(--muted)}.changes{padding:0 16px}.change{border-bottom:1px solid var(--line);padding:10px 0}.change:last-child{border:0}.change summary{color:var(--ink);font-size:.9rem}.change summary small{display:block;color:var(--muted);font-size:.75rem;font-weight:400}.change-content{border-left:3px solid #cddedc;padding:0 0 0 12px;margin:8px 0 6px;font-size:.85rem}.change-content p+p{margin-top:8px}.change-content dl{margin:0}.change-content dt{color:var(--muted);font-size:.75rem;margin-top:8px}.change-content dd{margin:0}.period-label{color:var(--muted);font-size:.75rem;margin-bottom:4px}.hero{background:var(--navy);color:#fff}.hero h1{margin-bottom:12px}.entrances{display:grid;gap:8px}.entrance{width:100%;display:flex;justify-content:space-between;gap:8px;min-height:52px;background:#203d61;border-color:#7990ab;color:#fff}.entrance.first{background:#fff;color:var(--navy)}.assessments{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.assessment{background:#edf2fa;text-align:left;padding:14px;min-height:94px;font-size:1.05rem}.assessment small{display:block;margin-top:12px;font-size:.8rem;font-weight:400}.preview-note{border-top:1px solid var(--line);margin-top:26px;padding-top:18px;font-size:.85rem}.preview-note h2{margin-bottom:8px}.preview-note p{margin-bottom:10px}.preview-controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.preview-controls button{font-size:.8rem;flex:1}.preview-controls [aria-pressed=true]{background:var(--pale);border-color:var(--accent)}footer{max-width:720px;margin:auto;padding:0 16px 28px;font-size:.8rem;color:var(--muted)}footer p{margin-top:8px}dialog{width:min(92vw,440px);max-height:85dvh;overflow:auto;border:1px solid var(--line);border-radius:16px;padding:22px;color:var(--ink);background:#fff}dialog::backdrop{background:#142d4e80}dialog p{margin:14px 0;font-size:.9rem}dialog .button{width:100%}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(min-width:650px){main{padding-top:26px}.panel{padding:22px}.timeline,.changes{padding:0 22px}.plot{height:210px}.overall-rate{font-size:3rem}}
@media(max-width:350px){.panel{padding:16px 12px}.timeline,.changes{padding:0 12px}.heading{gap:6px}.heading .button{font-size:.8rem;padding:9px}.tabs{gap:6px}.tabs button{font-size:.75rem}.chart{padding-left:30px}.plot{margin:0 22px}.point{width:40px;height:44px}.field-head{gap:8px}.field-head strong{font-size:.88rem}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.header-inner{flex-wrap:wrap}.button{min-width:0;max-width:100%;overflow-wrap:anywhere}.trend-heading label{min-width:0;max-width:100%}.trend-heading select{width:100%;min-width:0}.x-labels span{min-width:0;overflow-wrap:anywhere;text-align:center}
</style>

<body>
<div class="banner">画面案 · 学習記録と日付はサンプルです</div>
<header class="header"><div class="header-inner"><div class="brand"><span class="brand-mark" aria-hidden="true">一</span>ひと問</div><button class="button quiet" data-demo="settings">表示・データ</button></div></header>
<nav class="nav" aria-label="画面"><button class="button" data-view="home">学習</button><button class="button" data-view="fields">分野</button><button class="button" data-view="records" aria-current="page">記録</button></nav>
<main id="main"></main>
<footer><a href="../">実際のひと問を開く</a><p>このページの操作は端末・Firebaseに保存されません。</p></footer>
<dialog id="demo" aria-labelledby="demo-title"><h2 id="demo-title"></h2><p id="demo-text"></p><button class="button primary" id="close-demo">戻る</button></dialog>
<script>
'use strict';
const dates=['9/6','9/13','9/20','9/27','10/4','10/11'];
const fields=[
 {id:'all',name:'すべての分野',points:[[8,19],[15,31],[28,53],[39,68],[52,95],[80,133]]},
 {id:'database',name:'データベース',points:[null,[2,7],[4,10],[5,13],[8,18],[12,24]],counts:[12,4,6,2]},
 {id:'network',name:'ネットワーク',points:[[2,5],[4,8],[6,10],[9,14],[12,17],[17,22]],counts:[17,2,3,0]},
 {id:'security',name:'セキュリティ',points:[[3,6],[5,9],[8,13],[10,16],[14,20],[18,24]],counts:[18,2,3,1]},
 {id:'algorithm',name:'アルゴリズム・プログラミング',points:[[0,2],[1,4],[2,7],[3,10],[4,11],[4,12]],counts:[4,4,3,1]},
 {id:'hardware',name:'ハードウェア',points:[null,null,[0,1],null,[1,2],[2,3]],counts:[2,0,1,0]}
];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rate=p=>p?Math.round(p[0]/p[1]*100):null;
const initialView=location.hash.slice(1);
let view=['records','planning','home','fields'].includes(initialView)?initialView:'records',recordMode='learning',fieldId='all',selectedPoint=5,empty=false;
function graph(){
 const field=fields.find(f=>f.id===fieldId),points=empty?dates.map(()=>null):field.points;
 let line='',previous=false;
 points.forEach((point,i)=>{if(!point){previous=false;return;}line+=`${previous?'L':'M'}${i*120},${176*(1-point[0]/point[1])} `;previous=true;});
 return `<section class="panel trend" aria-labelledby="trend-title"><div class="trend-heading"><h2 id="trend-title">自力正答率の推移</h2><label><span class="sr-only">推移を見る分野</span><select id="trend-field">${fields.map(f=>`<option value="${f.id}" ${fieldId===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></label></div><p class="muted trend-period">6週間 · 各時点の直近28日</p>${points.some(Boolean)?`<div class="chart"><div class="y-labels" aria-hidden="true"><span>100%</span><span>50%</span><span>0%</span></div><div class="plot"><svg viewBox="0 0 600 176" preserveAspectRatio="none" aria-hidden="true"><path class="chart-grid" d="M0 0H600M0 88H600M0 176H600"/><path class="chart-line" d="${line}"/></svg>${points.map((point,i)=>point?`<button class="point ${point[1]<10?'small-sample':''}" data-point="${i}" aria-pressed="${selectedPoint===i}" aria-label="${dates[i]}、自力正答率${rate(point)}%、${point[1]}問中${point[0]}問自力正解" style="left:${i*20}%;top:${100*(1-point[0]/point[1])}%"></button>`:'').join('')}</div><div class="x-labels" aria-hidden="true">${dates.map(d=>`<span>${d}</span>`).join('')}</div></div><div class="point-detail" id="point-detail" role="status"></div>`:'<p class="muted" style="padding:32px 0">問題に取り組むと、ここに推移が表示されます。</p>'}<details class="trend-help"><summary>グラフの数え方</summary><p>各日付の時点で、直近28日に完了した通常学習を集計します。同じ問題は期間内の最後の結果だけを数えます。ヒント付き正解・解答閲覧は自力正解に含めません。</p><p>記録なしは0%にせず空白にします。10問未満の点は点線で表示します。取り組んだ問題や分野によって率は変わるため、このグラフだけで習熟や合格は判断しません。診断・模試は別の記録です。</p></details></section>`;
}
function updatePoint(){const point=fields.find(f=>f.id===fieldId).points[selectedPoint],target=document.querySelector('#point-detail');if(!target||!point)return;target.innerHTML=`<div class="detail-top"><span class="muted">${dates[selectedPoint]}時点 · 直近28日</span><strong>${rate(point)}%</strong></div><p>${point[1]}問に取り組み · 自力正解 ${point[0]}問${point[1]<10?' <span class="muted">· 記録少なめ</span>':''}</p>`;document.querySelectorAll('[data-point]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.point)===selectedPoint)));}
function fieldRows(){return [...fields.filter(f=>f.counts),{id:'others',name:'他12分野',counts:[27,8,10,3]}].map(f=>{const total=f.counts.reduce((a,b)=>a+b,0);return `<section class="field"><div class="field-head"><strong>${esc(f.name)}</strong>${f.id!=='others'?`<button data-trend="${f.id}">推移を見る <span aria-hidden="true">↑</span></button>`:''}</div>${empty?'<p class="muted">未確認</p>':`<div class="bar" role="img" aria-label="${esc(f.name)}、${total}問中${f.counts[0]}問自力正解">${f.counts.map((n,i)=>`<span class="${['self','assisted','incorrect','revealed'][i]}" style="width:${n/total*100}%"></span>`).join('')}</div><p class="field-counts">自力 ${f.counts[0]} · ヒント付き ${f.counts[1]} · 不正解 ${f.counts[2]} · 解答閲覧 ${f.counts[3]}</p>`}</section>`;}).join('');}
function records(){return `<div class="heading"><h1>学習記録</h1><button class="button quiet" data-view="fields">分野を選ぶ →</button></div><div class="tabs" role="group" aria-label="記録の種類">${[['learning','普段の学習'],['diagnostic','診断結果'],['mock','模試結果']].map(([id,name])=>`<button class="button" data-record="${id}" aria-pressed="${recordMode===id}">${name}</button>`).join('')}</div>${recordMode==='learning'?`<section class="panel overall"><h2>自力正答率 <span>· 直近28日</span></h2><p class="overall-rate">${empty?'未確認':'60<small>%</small>'}</p><p class="overall-count">${empty?'0問に取り組み · 自力正解 0問':'133問に取り組み · 自力正解 80問'}</p></section>${graph()}<h2 class="section-heading">分野別の記録</h2><div class="legend">${[['self','自力正解'],['assisted','ヒント付き'],['incorrect','不正解'],['revealed','解答閲覧']].map(([c,name])=>`<span><i class="${c}"></i>${name}</span>`).join('')}</div><section class="panel">${fieldRows()}</section><div class="link-row"><button class="button" data-view="planning">計画・これまでの実績 →</button><button class="button" data-demo="answers">回答履歴 →</button></div>`:`<section class="panel"><h2>${recordMode==='diagnostic'?'30問の診断結果':'模試 Aの結果'}</h2><p class="plan-count">${recordMode==='diagnostic'?'60% <small>· 18 / 30問正解</small>':'75% <small>· 60 / 80問正解</small>'}</p><p class="muted">10/5 · 支援なし</p><button class="button" data-demo="result" style="margin-top:14px">結果を見る</button></section><p class="muted">診断・模試は、通常学習の推移とは分けて表示します。このモックでは既存の結果画面を簡略化しています。</p>`}`;}
function planning(){return `<div class="heading"><h1>学習計画</h1><button class="button quiet" data-view="records">記録へ</button></div><section class="panel"><h2>試験まで27日</h2><p class="plan-date">選択式 · 2026/11/7</p><p class="period-label" style="margin-top:16px">現在の期間 · 10/5〜10/18</p><h3 class="phase-name">過去問で理解を確かめる</h3><p class="plan-count">73 / 120回 <small>· あと47回</small></p><div class="plan-bar" role="img" aria-label="目標120回に対し73回"><span style="width:${73/120*100}%"></span></div><span class="focus-label">重点：データベース</span><div class="link-row"><button class="button primary" data-demo="study">この範囲から1問</button></div><details class="trend-help"><summary>計画の前提</summary><p>教科書は一通り読んだ。平日は30分、週末は1時間。10/5の診断でDBは3問中1問正解だったため、次の期間はDBを重点にする。</p></details></section><div class="link-row"><button class="button" data-demo="edit">計画を編集</button><button class="button" data-demo="ai">AIに相談</button></div><h2 class="section-heading">これまでの計画</h2><p class="muted" style="margin-bottom:10px">終了した期間の実績</p><section class="panel timeline">${[{dates:'9/28〜10/4',name:'過去問に慣れる',actual:64,target:70,focus:'ネットワーク・セキュリティ',note:'平日は短い時間で取り組み、週末にまとめて復習。'},{dates:'9/14〜9/27',name:'基礎を一通り確認する',actual:83,target:90,focus:'全分野',note:'教科書を読み終えた範囲から問題を解く。'}].map(phase=>`<article class="history-period"><p class="period-label">${phase.dates}</p><h3>${phase.name}</h3><p class="history-count">${phase.actual}回に取り組んだ <small>／目標${phase.target}回</small></p><div class="plan-bar" role="img" aria-label="目標${phase.target}回に対し${phase.actual}回"><span style="width:${phase.actual/phase.target*100}%"></span></div><details><summary><span>当時の計画を見る</span><span aria-hidden="true">›</span></summary><p>重点：${phase.focus}</p><p>${phase.note}</p><p>ここには当時の目標を残します。実績は、この期間の通常学習の完了回数です。</p></details></article>`).join('')}</section><h3 class="section-heading">計画の変更</h3><section class="panel changes"><details class="change"><summary><span><small>10/5 · 変更</small>次の期間はDBを重点に</span><span aria-hidden="true">›</span></summary><div class="change-content"><dl><dt>重点分野</dt><dd>ネットワーク・セキュリティ → データベース</dd><dt>10/5〜10/18の目標</dt><dd>90回 → 120回</dd><dt>変更した理由</dt><dd>診断で確認したDBの問題を、教科書に戻って解き直したい。</dd></dl><button class="button quiet" data-demo="old-plan" style="margin-top:14px">変更前の計画を見る</button></div></details><details class="change"><summary><span><small>9/28 · 変更</small>期間を3日短縮</span><span aria-hidden="true">›</span></summary><div class="change-content"><p>終了日：10/7 → 10/4</p><p>次の期間を前倒しする。目標は70回のまま。</p></div></details><details class="change"><summary><span><small>9/12 · 登録</small>最初の計画を作成</span><span aria-hidden="true">›</span></summary><div class="change-content"><p>教科書で学んだ範囲を、過去問で確認する計画。</p><button class="button quiet" data-demo="initial-plan">このときの計画を見る</button></div></details></section>`;}
function home(){return `<section class="panel hero"><h1>とりあえずはじめる</h1><div class="entrances">${['身軽に1問','書いて考える1問','おまかせで1問','分野を選んで1問'].map((name,i)=>`<button class="button entrance ${i===0?'first':''}" ${i===3?'data-view="fields"':'data-demo="study"'}><span>${name}</span><span aria-hidden="true">→</span></button>`).join('')}</div></section><div class="assessments"><button class="button assessment" data-open-record="diagnostic">実力診断<small>結果を見る →</small></button><button class="button assessment" data-open-record="mock">模試<small>80問 × 2回 →</small></button></div><div class="link-row"><button class="button" data-demo="cards">単語帳</button><button class="button" data-demo="review">解き直し</button></div><section class="panel"><div class="heading" style="margin-bottom:5px"><h2>試験まで27日</h2><button class="button quiet" data-view="planning">計画を見る</button></div><p>今日：データベースを1問</p><p class="muted">73 / 120回 · あと47回</p></section><p class="muted">ホームにグラフや履歴を増やさず、入口と今日やることを優先します。診断・模試の遷移先は、このモックでは記録に省略しています。</p>`;}
function fieldList(){return `<div class="heading"><h1>分野別に解く</h1><button class="button quiet" data-view="records">記録へ</button></div><section class="panel">${fields.filter(f=>f.id!=='all').map(f=>`<div class="field"><div class="field-head"><strong>${esc(f.name)}</strong><button data-demo="study">学習する →</button></div></div>`).join('')}</section><p class="muted">このモックの分野一覧は省略版です。</p>`;}
function render(){document.querySelectorAll('.nav [data-view]').forEach(b=>{const active=b.dataset.view===(view==='planning'?'records':view);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});document.querySelector('#main').innerHTML=(view==='planning'?planning():view==='home'?home():view==='fields'?fieldList():records())+`<section class="preview-note"><h2>この画面案で確認できること</h2><p>「記録」には正答率の推移。「計画」には期間の実績と変更履歴。グラフの点・分野選択・過去計画の展開を操作できます。</p><div class="preview-controls"><button class="button" data-view="records">推移グラフを見る</button><button class="button" data-view="planning">計画履歴を見る</button></div>${view==='records'&&recordMode==='learning'?`<div class="preview-controls" role="group" aria-label="サンプルの記録状態"><button class="button" data-empty="false" aria-pressed="${!empty}">記録あり</button><button class="button" data-empty="true" aria-pressed="${empty}">まだ記録なし</button></div>`:''}<p class="muted">デザインの初稿です。数値・前提・履歴は架空のサンプルで、アプリ本体は変更していません。</p></section>`;if(view==='records'&&recordMode==='learning')updatePoint();}
function show(next){view=next;render();history.replaceState(null,'','#'+next);window.scrollTo(0,0);}
const demos={settings:['表示・データ','既存の設定・同期画面へ進む想定です。モックではアカウントや学習データへ接続しません。'],study:['学習する','通常の1問へ進む想定です。このページでは学習記録を作りません。'],cards:['単語帳','既存の単語帳へ進む想定です。'],review:['解き直し','既存の復習一覧へ進む想定です。'],answers:['回答履歴','既存の問題ごとの回答履歴を開く想定です。'],result:['結果を見る','既存の診断・模試の結果と解説を開く想定です。'],edit:['計画を編集','既存の計画編集へ進みます。保存した時点の計画を履歴に残す案です。'],ai:['AIに相談','既存の学習状況Exportと計画JSONの入口へ進む想定です。'], 'initial-plan':['最初の計画 · 9/12','9/14〜9/27：基礎を一通り確認する。目標90回、重点は全分野。教科書で学んだ範囲から過去問を解く計画です。閲覧のみで、現在の計画は置き換えません。'], 'old-plan':['変更前の計画 · 10/5の変更前','10/5〜10/18：過去問で理解を確かめる。目標90回、重点はネットワーク・セキュリティ。これは閲覧用のサンプルで、現在の計画は置き換えません。']};
document.addEventListener('click',e=>{const control=e.target.closest('button');if(!control)return;if(control.dataset.view){show(control.dataset.view);return;}if(control.dataset.record){recordMode=control.dataset.record;render();return;}if(control.dataset.openRecord){recordMode=control.dataset.openRecord;show('records');return;}if(control.dataset.point!==undefined){selectedPoint=Number(control.dataset.point);updatePoint();return;}if(control.dataset.trend){fieldId=control.dataset.trend;selectedPoint=5;render();document.querySelector('.trend').scrollIntoView({block:'start'});document.querySelector('#trend-field').focus({preventScroll:true});return;}if(control.dataset.empty!==undefined){empty=control.dataset.empty==='true';render();return;}if(control.dataset.demo){const [title,description]=demos[control.dataset.demo];document.querySelector('#demo-title').textContent=title;document.querySelector('#demo-text').textContent=description;document.querySelector('#demo').showModal();return;}});
document.addEventListener('change',e=>{if(e.target.id==='trend-field'){fieldId=e.target.value;selectedPoint=5;const top=window.scrollY;render();window.scrollTo(0,top);document.querySelector('#trend-field').focus({preventScroll:true});}});
document.querySelector('#close-demo').addEventListener('click',()=>document.querySelector('#demo').close());
render();
</script>
</body>
</html>
