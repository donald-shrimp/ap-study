name: FP2 historical draft structure checks
on:
  pull_request:
    paths:
      - 'work/fp2/historical/**'
      - '.github/workflows/fp2-historical-progress.yml'
  push:
    paths:
      - 'work/fp2/historical/**'
      - '.github/workflows/fp2-historical-progress.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify each present exam draft independently
        run: |
          python - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('work/fp2/historical')
          expected={'202501':68,'202409':70,'202405':68}
          found=0
          for era,field_count in expected.items():
              folder=root/era
              if not (folder/'questions.json').exists():
                  continue
              found+=1
              qs=json.loads((folder/'questions.json').read_text(encoding='utf-8'))
              cs=json.loads((folder/'practical-cases.json').read_text(encoding='utf-8'))
              hs=json.loads((folder/'source-files.json').read_text(encoding='utf-8'))
              assert len(qs)==60,(era,'academic',len(qs))
              assert len(cs)==40,(era,'practical',len(cs))
              assert len(hs)==4,(era,'source files',len(hs))
              assert [q['id'] for q in qs]==[f'fp2-{era}-objective-q{i:02}' for i in range(1,61)]
              assert [c['id'] for c in cs]==[f'fp2-{era}-jafp-q{i:02}' for i in range(1,41)]
              for q in qs:
                  assert isinstance(q.get('version'),int) and q['version']>=1
                  assert q['enrichment']=='draft'
                  assert q['legalReview']['status']=='unverified'
                  assert len(q['choices'])==len(q['choiceReasons'])==4
                  assert q['correctChoiceId'] in [c['id'] for c in q['choices']]
                  assert q.get('explanation'), (era,q['id'],'missing draft explanation')
                  # summary/takeaway are optional in older drafts; an independent reviewer must judge educational quality.
                  assert q['sourceRecord']['questionSha256']==hs[f'sources/fp2/g2_{era}_q.pdf']
                  assert q['sourceRecord']['answerSha256']==hs[f'sources/fp2/g2_{era}_a.pdf']
              field_total=0
              for c in cs:
                  assert c['status']=='draft'
                  assert isinstance(c.get('version'),int) and c['version']>=1
                  assert c['legalReview']['status']=='unverified'
                  assert c['sourceRecord']['questionSha256']==hs[f'sources/fp2/j2_{era}_q.pdf']
                  assert c['sourceRecord']['answerSha256']==hs[f'sources/fp2/j2_{era}_a.pdf']
                  for item in c['items']:
                      for field in item['fields']:
                          field_total+=1
                          assert field.get('explanation') and field.get('referenceAnswers')
              assert field_total==field_count,(era,'practical fields',field_total)
              assert len(set([q['id'] for q in qs]+[c['id'] for c in cs]))==100
              print(f'{era}: PASS draft structure 60 academic + 40 practical / {field_total} fields')
          if not found:
              print('No historical draft folders present on this branch; skipped data checks.')
          print('Structural verification only: does NOT establish source-text accuracy, legal validity, explanation quality or approval.')
          PY
