name: FP2 2024 May source figure crop
on:
  push:
    branches: [draft/fp2-202405-content-split]
    paths:
      - '.github/workflows/fp2-source-figure-crop.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF crop library
        run: python -m pip install 'pymupdf>=1.24,<2'
      - name: Verify original PDFs and crop source diagrams
        run: python tools/fp2_extract_202405_figures.py
      - name: Confirm reference targets and commit original-only PNGs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("work/fp2/historical/202405")
          o=json.loads((p/"questions.json").read_text())
          cases=json.loads((p/"practical-cases.json").read_text())
          assert len(o)==60 and len(cases)==40
          assert len(o[52]["sourceImages"])==1
          assert len([q for q in cases if q["bodyFigures"]])==34
          for q in cases:
              for f in q["bodyFigures"]:
                  assert Path(f["image"]).is_file(),f["image"]
                  assert f["anchor"] in q["body"]
          for q in o:
              for image in q.get("sourceImages",[]):
                  assert Path(image).is_file(),image
          print("All source image references exist and anchors are present")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/written/fp2/202405 assets/fp2/202405 work/fp2/historical/202405/questions.json work/fp2/historical/202405/practical-cases.json
          test -n "$(git status --porcelain)"
          git commit -m 'assets(fp2): crop original Japanese FP Association May 2024 figures'
          git push origin "HEAD:${{ github.ref_name }}"
