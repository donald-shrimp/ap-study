name: FP2 practical official PDF evidence
on:
  push:
    branches: [draft/fp2-202605-jafp-practical-samples]
    paths: [.github/workflows/fp2-practical-source-check.yml]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download official question and answer PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          for kind in q a; do
            url="https://www.jafp.or.jp/exam/mohan/files/j2_202605_${kind}.pdf"
            curl --fail --location --silent --show-error --retry 3 --max-time 90 --output "output/j2_202605_${kind}.pdf" "$url"
            test "$(head -c 5 "output/j2_202605_${kind}.pdf")" = '%PDF-'
            sha256sum "output/j2_202605_${kind}.pdf"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: fp2-202605-practical-official-pdfs
          path: output/
          retention-days: 30
