name: FP2 historical draft authoring and validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --quiet pymupdf
      - name: Generate and validate exam drafts in chronological batches
        run: |
          python tools/build-fp2-historical-drafts.py
      - name: Export text datasets for Git tree staging
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          for era in ('202501','202409','202405'):
              root=Path('deliveries')/f'fp2-jafp-{era}-draft/content/fp2'
              for name in ('questions.json','practical-cases.json','source-files.json'):
                  blob=base64.b64encode((root/name).read_bytes()).decode('ascii')
                  for i in range(0,len(blob),4096):
                      print(f'FP2EXPORT::{era}::{name}::{i//4096}::{blob[i:i+4096]}',flush=True)
          PY
      - name: Upload validated 2025-01 draft
        uses: actions/upload-artifact@v4
        with:
          name: fp2-202501-draft-delivery
          path: deliveries/fp2-jafp-202501-draft/
          retention-days: 30
      - name: Upload validated 2024-09 draft
        uses: actions/upload-artifact@v4
        with:
          name: fp2-202409-draft-delivery
          path: deliveries/fp2-jafp-202409-draft/
          retention-days: 30
      - name: Upload validated 2024-05 draft
        uses: actions/upload-artifact@v4
        with:
          name: fp2-202405-draft-delivery
          path: deliveries/fp2-jafp-202405-draft/
          retention-days: 30
