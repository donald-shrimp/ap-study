name: FP2 source PDF digest (temporary)
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/fp2-source-digest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sha256:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch official exam PDF and compute SHA256
        shell: bash
        run: |
          set -euo pipefail
          url='https://www.jafp.or.jp/exam/mohan/files/g2_202605_qa.pdf'
          curl --fail --location --silent --show-error --retry 3 --max-time 90 --output /tmp/g2_202605_qa.pdf "$url"
          test "$(head -c 5 /tmp/g2_202605_qa.pdf)" = '%PDF-'
          printf 'SOURCE_URL=%s\n' "$url"
          printf 'BYTE_SIZE=%s\n' "$(wc -c </tmp/g2_202605_qa.pdf)"
          sha256sum /tmp/g2_202605_qa.pdf
