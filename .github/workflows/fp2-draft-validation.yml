name: FP2 draft delivery validation
on:
  pull_request:
    paths:
      - 'delivery/**'
      - '.github/workflows/fp2-draft-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify source PDF hashes and draft material structure
        run: python tools/check-fp2-delivery.py delivery
